<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js (Markdown 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- 主页视图 -->
        <div id="home-view" class="fade-in space-y-10">

            <!-- 头部简介 -->
            <header class="flex flex-col md:flex-row items-center md:items-start text-center md:text-left gap-8 pb-4">
                <div class="relative group shrink-0">
                    <img id="avatar-img" src="" alt="Avatar"
                        class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-lg border-4 border-white bg-white">
                </div>
                <div
                    class="flex-1 space-y-4 pt-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                    <h1 id="profile-name" class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                    </h1>
                    <p id="profile-bio" class="text-lg text-slate-600 max-w-2xl leading-relaxed"></p>
                    <div id="social-links" class="flex justify-center md:justify-start gap-4 pt-2"></div>
                </div>
            </header>

            <!-- 重点推荐：Deep Well -->
            <section id="featured-game" class="cursor-pointer"
                onclick="window.open('https://your-deep-well-link.com', '_blank')">
                <div
                    class="deep-well-card rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 md:gap-8 relative overflow-hidden group">
                    <div
                        class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-blue-500 rounded-full blur-3xl opacity-20 group-hover:opacity-30 transition-opacity">
                    </div>
                    <div
                        class="w-20 h-20 md:w-24 md:h-24 bg-indigo-50 rounded-2xl flex items-center justify-center shrink-0 border border-indigo-100 shadow-inner z-10">
                        <i class="fa-solid fa-gamepad text-3xl md:text-4xl text-indigo-500"></i>
                    </div>
                    <div class="flex-1 text-center md:text-left z-10">
                        <div class="flex items-center justify-center md:justify-start gap-3 mb-2">
                            <h2 class="text-2xl font-bold text-slate-900">Deep Well</h2>
                            <span
                                class="bg-indigo-600 text-xs px-2.5 py-1 rounded-md text-white font-semibold shadow-sm">New
                                Release</span>
                        </div>
                        <p class="text-slate-600 text-sm md:text-base leading-relaxed mb-4 md:mb-0">
                            深入未知的井底，探索程序化生成的迷宫。一款基于 WebGL 的沉浸式网页游戏。
                        </p>
                    </div>
                    <div class="shrink-0 z-10">
                        <span
                            class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 transition-colors border border-slate-200 shadow-sm text-slate-400">
                            <i class="fa-solid fa-play ml-1 relative left-[1px]"></i>
                        </span>
                    </div>
                </div>
            </section>

            <!-- 文章归档时间轴 -->
            <section
                class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                <div
                    class="flex flex-col md:flex-row md:items-center justify-between mb-8 pb-6 border-b border-slate-100 gap-4">
                    <h2 class="text-2xl font-bold text-slate-900 flex items-center">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-500 mr-3 text-lg"></i>时间轴归档
                    </h2>

                    <!-- 分类筛选器 -->
                    <div id="category-filters" class="flex flex-wrap gap-2">
                        <!-- JS 动态生成 -->
                        <button
                            class="filter-btn active px-4 py-1.5 rounded-full border border-gray-300 text-sm text-gray-600 hover:border-gray-400 bg-white">全部</button>
                    </div>
                </div>

                <!-- 时间轴列表容器 -->
                <div id="timeline-container" class="space-y-0">
                    <!-- 内容由 JS 生成 -->
                </div>
            </section>

            <footer
                class="text-center text-slate-500 font-medium text-sm py-6 bg-white rounded-2xl shadow-sm border border-slate-100 mt-12 mx-auto max-w-[240px]">
                <p>&copy; <span id="year"></span> Designed by You.</p>
            </footer>
        </div>

        <!-- 文章详情页 -->
        <div id="detail-view" class="hidden fade-in pb-20">
            <div
                class="sticky top-6 bg-white/95 backdrop-blur-md z-20 p-4 mb-8 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition-shadow hover:shadow-md max-w-4xl mx-auto">
                <button onclick="goHome()"
                    class="group flex items-center gap-3 text-slate-600 hover:text-indigo-600 transition-colors font-semibold">
                    <div
                        class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-indigo-50 transition-colors border border-slate-100">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </div>
                    返回主页
                </button>
                <button
                    class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center hover:bg-indigo-50 hover:text-indigo-600 text-slate-500 transition-colors border border-slate-100"
                    onclick="copyLink()">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
            </div>

            <article
                class="bg-white rounded-2xl shadow-sm p-6 md:p-10 mb-10 border border-slate-100 hover:shadow-md transition-shadow min-h-[300px]">
                <div id="loading-indicator" class="hidden text-center py-20 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p>正在加载内容...</p>
                </div>

                <div id="article-header">
                    <div class="flex items-center gap-3 mb-4">
                        <span id="detail-category"
                            class="text-xs font-bold tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-md uppercase shadow-sm"></span>
                    </div>
                    <h1 id="detail-title"
                        class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4 tracking-tight"></h1>
                    <div class="flex items-center gap-4 text-sm text-slate-500 mb-6 font-medium">
                        <span id="detail-date"><i class="far fa-calendar-alt mr-1"></i> </span>
                    </div>
                    <img id="detail-image" src="" class="w-full h-64 md:h-96 object-cover rounded-xl mb-8 shadow-md"
                        alt="Cover">
                </div>
                <div id="detail-content" class="markdown-body"></div>
                <div class="mt-12 pt-8 border-t border-slate-100" id="detail-link-container">
                    <a id="detail-link" href="#" target="_blank"
                        class="inline-flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-xl hover:bg-indigo-600 transition-colors font-semibold shadow-sm hover:shadow-md">
                        访问相关链接 <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                    </a>
                </div>
            </article>

            <!-- 评论区 -->
            <section
                class="bg-white rounded-2xl shadow-sm p-6 md:p-10 border border-slate-100 hover:shadow-md transition-shadow mt-10">
                <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                    <i class="fa-regular fa-comments text-indigo-500"></i> 评论讨论
                </h3>
                <div id="comments-list" class="min-h-[150px]">
                    <!-- Giscus 评论组件将通过 js/app.js 自动加载到这里 -->
                </div>
            </section>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
