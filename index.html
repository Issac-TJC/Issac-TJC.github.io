<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js (Markdown 解析) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- 主页视图 -->
        <div id="home-view" class="fade-in space-y-10">

            <!-- 头部简介 -->
            <header class="flex flex-col md:flex-row items-center md:items-start text-center md:text-left gap-8 pb-4">
                <div class="relative group shrink-0">
                    <img id="avatar-img" src="" alt="Avatar"
                        class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-lg border-4 border-white">
                </div>
                <div class="flex-1 space-y-4 pt-2">
                    <h1 id="profile-name" class="text-3xl md:text-4xl font-bold tracking-tight text-gray-900"></h1>
                    <p id="profile-bio" class="text-lg text-gray-600 max-w-2xl leading-relaxed"></p>
                    <div id="social-links" class="flex justify-center md:justify-start gap-5 pt-1"></div>
                </div>
            </header>

            <!-- 重点推荐：Deep Well -->
            <section id="featured-game" class="cursor-pointer"
                onclick="window.open('https://your-deep-well-link.com', '_blank')">
                <div
                    class="deep-well-card rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 md:gap-8 relative overflow-hidden group">
                    <div
                        class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-blue-500 rounded-full blur-3xl opacity-20 group-hover:opacity-30 transition-opacity">
                    </div>
                    <div
                        class="w-20 h-20 md:w-24 md:h-24 bg-blue-900/50 rounded-2xl flex items-center justify-center shrink-0 border border-blue-700/50 shadow-inner">
                        <i class="fa-solid fa-gamepad text-3xl md:text-4xl text-blue-300"></i>
                    </div>
                    <div class="flex-1 text-center md:text-left z-10">
                        <div class="flex items-center justify-center md:justify-start gap-3 mb-2">
                            <h2 class="text-2xl font-bold">Deep Well</h2>
                            <span class="bg-blue-600 text-xs px-2 py-1 rounded text-white font-medium">New
                                Release</span>
                        </div>
                        <p class="text-gray-300 text-sm md:text-base leading-relaxed mb-4 md:mb-0">
                            深入未知的井底，探索程序化生成的迷宫。一款基于 WebGL 的沉浸式网页游戏。
                        </p>
                    </div>
                    <div class="shrink-0 z-10">
                        <span
                            class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 transition-colors border border-white/10">
                            <i class="fa-solid fa-play text-white ml-1"></i>
                        </span>
                    </div>
                </div>
            </section>

            <!-- 文章归档时间轴 -->
            <section>
                <div
                    class="flex flex-col md:flex-row md:items-center justify-between mb-8 pb-4 border-b border-gray-200 gap-4">
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                        <i class="fa-solid fa-clock-rotate-left text-gray-400 mr-3 text-lg"></i>时间轴归档
                    </h2>

                    <!-- 分类筛选器 -->
                    <div id="category-filters" class="flex flex-wrap gap-2">
                        <!-- JS 动态生成 -->
                        <button
                            class="filter-btn active px-4 py-1.5 rounded-full border border-gray-300 text-sm text-gray-600 hover:border-gray-400 bg-white">全部</button>
                    </div>
                </div>

                <!-- 时间轴列表容器 -->
                <div id="timeline-container" class="space-y-0">
                    <!-- 内容由 JS 生成 -->
                </div>
            </section>

            <footer class="text-center text-gray-400 text-sm py-8 border-t border-gray-100 mt-12">
                <p>&copy; <span id="year"></span> Designed by You.</p>
            </footer>
        </div>

        <!-- 文章详情页 -->
        <div id="detail-view" class="hidden fade-in pb-20">
            <div
                class="sticky top-0 bg-[#f9fafb]/95 backdrop-blur-sm z-10 py-4 mb-6 border-b border-gray-200 flex items-center justify-between">
                <button onclick="goHome()"
                    class="group flex items-center gap-2 text-gray-600 hover:text-black transition-colors">
                    <div
                        class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center group-hover:border-gray-400">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </div>
                    <span class="font-medium">返回列表</span>
                </button>
                <button class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200"
                    onclick="copyLink()">
                    <i class="fa-solid fa-share-nodes text-gray-600 text-sm"></i>
                </button>
            </div>

            <article class="bg-white rounded-2xl shadow-sm p-6 md:p-10 mb-10 border border-gray-100 min-h-[300px]">
                <div id="loading-indicator" class="hidden text-center py-20 text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p>正在加载内容...</p>
                </div>

                <div id="article-header">
                    <div class="flex items-center gap-3 mb-4">
                        <span id="detail-category"
                            class="text-xs font-bold tracking-wider text-white bg-blue-600 px-2 py-1 rounded uppercase"></span>
                    </div>
                    <h1 id="detail-title" class="text-3xl md:text-4xl font-bold text-gray-900 mb-4"></h1>
                    <div class="flex items-center gap-4 text-sm text-gray-500 mb-6">
                        <span id="detail-date"><i class="far fa-calendar-alt mr-1"></i> </span>
                    </div>
                    <img id="detail-image" src="" class="w-full h-64 md:h-96 object-cover rounded-xl mb-8 shadow-md"
                        alt="Cover">
                </div>
                <div id="detail-content" class="markdown-body"></div>
                <div class="mt-10 pt-6 border-t border-gray-100" id="detail-link-container">
                    <a id="detail-link" href="#" target="_blank"
                        class="inline-flex items-center gap-2 px-6 py-3 bg-gray-900 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium">
                        访问相关链接 <i class="fa-solid fa-external-link-alt text-xs"></i>
                    </a>
                </div>
            </article>

            <!-- 评论区 -->
            <section class="bg-white rounded-2xl shadow-sm p-6 md:p-10 border border-gray-100">
                <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <i class="fa-regular fa-comments"></i> 评论区
                </h3>
                <div id="comments-list" class="min-h-[150px]">
                    <!-- Giscus 评论组件将通过 js/app.js 自动加载到这里 -->
                </div>
            </section>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
